apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: resume
  labels:
    app: load-generator
spec:
  containers:
  - name: load-generator
    image: busybox
    command:
    - /bin/sh
    - -c
    - |
      while true; do
        wget -q -O- http://backend-service:3000/health > /dev/null 2>&1
        wget -q -O- http://backend-service:3000/api/non-existent > /dev/null 2>&1
        sleep 0.2
      done
