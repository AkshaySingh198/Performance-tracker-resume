apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-mongo
  namespace: resume
spec:
  selector:
    matchLabels:
      app: mongo
  serviceName: service-mongo
  replicas: 1
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: resume-mongo
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongo
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-pvc
