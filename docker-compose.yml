services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_backend
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    
    restart: unless-stopped
    env_file:
      - backend/.env

  mongo:
    image: mongo:7.0
    container_name: resume_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=admin
    
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  

volumes:
  mongodb_data: