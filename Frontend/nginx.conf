server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Node.js backend container
    location /api/ {
        # Kubernetes internal DNS resolver (kube-dns)
        resolver 10.96.0.10 kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
        
        # Using a variable forces Nginx to resolve backend-service at request time, NOT on boot!
        set $backend_target "http://backend-service:3000";

        proxy_pass $backend_target/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}